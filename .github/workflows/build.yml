name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  NDK_VERSION: r27c
  GOPROXY: https://proxy.golang.org,direct

jobs:
  module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup show

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Android NDK
        run: |
          curl -fsSL -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          mkdir -p .ndk
          unzip -q /tmp/ndk.zip -d .ndk
          ls .ndk

      - name: Build sb4a
        run: ./scripts/build-android.sh

      - name: Build rootbox
        run: ./scripts/build-rootbox.sh

      - name: Module version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          sed -i "s/^version=.*/version=${GITHUB_REF_NAME}/; s/^versionCode=.*/versionCode=${GITHUB_RUN_NUMBER}/" module/module.prop
          cat module/module.prop

      - name: Pack module
        run: ./scripts/pack-module.sh

      - uses: actions/upload-artifact@v4
        with:
          name: sb4a-module-arm64
          path: target/sb4a-module-arm64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/sb4a-module-arm64.zip --title "$GITHUB_REF_NAME" --generate-notes
